name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, gd, fileinfo, pdo_sqlite
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      - run: php artisan test

  build-branch:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, gd, fileinfo
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: composer install --no-dev --optimize-autoloader --no-interaction
      - run: npm ci && npm run build
      # Plesk n'a ni Node ni Composer : la branche "deploy" contient vendor/ et public/build/.
      - name: Publier la branche deploy
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan deploy
          git add -A
          git add -f vendor public/build
          git commit -m "Build ${GITHUB_SHA}"
          git push --force origin deploy
